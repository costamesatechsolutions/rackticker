# Options for the HUB75 refresh daemon: standard rpi-rgb-led-matrix --led-* flags.
# Installed once to /etc/rackticker/matrix.conf; edit it there, then run
#   sudo systemctl restart rackticker-matrix
#
# --led-limit-refresh holds one steady refresh rate. Without it the rate swings
#   with system load (e.g. 208 Hz dropping to 93 Hz while ADS-B decodes), and
#   those swings show as bursts of brightness flicker. Keep it below the lowest
#   rate your panel reaches unlimited; measure with --led-show-refresh.
# --led-pwm-lsb-nanoseconds lengthens the shortest PWM pulse so colours stay true
#   at very low brightness (whites drifting pink), at some cost in refresh rate.
#
# Other hardware, for example an Adafruit bonnet driving two 64x32 panels:
#   --led-gpio-mapping=adafruit-hat --led-rows=32 --led-cols=64 --led-chain=2
MATRIX_FLAGS="--led-limit-refresh=120 --led-pwm-lsb-nanoseconds=160"
