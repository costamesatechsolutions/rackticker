[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-f1-schedule"
version = "0.1.0"
description = "Key-free Formula 1 schedule screen for RackTicker"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
f1 = "rackticker_f1:plugin"

[tool.setuptools]
py-modules = ["rackticker_f1"]
