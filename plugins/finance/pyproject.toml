[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-finance"
version = "0.1.0"
description = "Key-free stock and cryptocurrency ribbon for RackTicker"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
finance = "rackticker_finance:plugin"

[tool.setuptools]
py-modules = ["rackticker_finance"]
