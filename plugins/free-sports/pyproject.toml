[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-free-sports"
version = "0.1.0"
description = "Key-free multi-league schedule and live-score provider for RackTicker"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
free_sports = "rackticker_free_sports:plugin"

[tool.setuptools]
py-modules = ["rackticker_free_sports"]
