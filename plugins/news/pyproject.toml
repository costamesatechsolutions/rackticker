[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-news"
version = "0.1.0"
description = "Configurable RSS and Atom headline ribbon for RackTicker"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
news = "rackticker_news:plugin"

[tool.setuptools]
py-modules = ["rackticker_news"]
