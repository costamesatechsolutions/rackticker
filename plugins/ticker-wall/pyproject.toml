[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-ticker-wall"
version = "0.1.0"
description = "Arena, Times Square, and taqueria-style scenes for RackTicker"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
ticker_wall = "rackticker_ticker_wall:plugin"

[tool.setuptools]
py-modules = ["rackticker_ticker_wall"]
