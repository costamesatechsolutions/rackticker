[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rackticker-traffic"
version = "0.1.0"
description = "Key-free California freeway incident board for RackTicker (CHP media feed)"
requires-python = ">=3.10"
dependencies = ["rackticker>=0.1,<0.2"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.entry-points."rackticker.plugins"]
traffic = "rackticker_traffic:plugin"

[tool.setuptools]
py-modules = ["rackticker_traffic"]
